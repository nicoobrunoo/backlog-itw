<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backlog ITW - Tablero Kanban</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #162033;
      --muted: #667085;
      --border: #d8e2ee;
      --blue: #075a9b;
      --blue-2: #10395f;
      --blue-soft: #e8f2fb;
      --shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
      --shadow-hover: 0 16px 36px rgba(15, 23, 42, 0.14);
      --red: #ef4444;
      --orange: #f97316;
      --yellow: #eab308;
      --gray: #94a3b8;
      --green: #22c55e;
      --teal: #14b8a6;
      --danger: #dc2626;
      --soft: #edf3f9;
      --input: #ffffff;
      --radius: 18px;
    }

    body.dark {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #334155;
      --blue: #38bdf8;
      --blue-2: #0f172a;
      --blue-soft: #10243a;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.36);
      --shadow-hover: 0 18px 40px rgba(0, 0, 0, 0.52);
      --soft: #1e293b;
      --input: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(11, 79, 138, .10), transparent 34%),
        var(--bg);
      color: var(--text);
    }

    header {
      background: linear-gradient(135deg, #064b83, #123b63);
      color: white;
      padding: 26px 32px;
      box-shadow: var(--shadow);
    }

    header h1 { margin: 0; font-size: 28px; letter-spacing: -.3px; }
    header p { margin: 8px 0 0; opacity: 0.92; }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(7, minmax(150px, 1fr));
      gap: 12px;
      padding: 18px 32px 0;
    }

    .stat-card {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    body.dark .stat-card { background: rgba(17,24,39,.88); }

    .stat-card strong {
      display: block;
      font-size: 27px;
      margin-bottom: 4px;
      color: var(--blue);
    }

    .stat-card span { color: var(--muted); font-size: 13px; font-weight: 800; }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 18px 32px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    button, input, textarea, select { font-family: inherit; }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 900;
      background: var(--blue);
      color: white;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      box-shadow: 0 8px 18px rgba(7, 90, 155, .18);
    }

    .btn:hover { transform: translateY(-1px); opacity: 0.94; }
    .btn.secondary { background: #e5edf7; color: #0b4f8a; box-shadow: none; }
    .btn.success { background: #dcfce7; color: #166534; box-shadow: none; }
    .btn.danger { background: #fee2e2; color: #991b1b; box-shadow: none; }

    .search, .sort-select {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      outline: none;
      background: var(--input);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
    }

    .search { flex: 1; min-width: 260px; }

    .status-line {
      padding: 0 32px 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, minmax(300px, 1fr));
      gap: 18px;
      padding: 12px 32px 24px;
      overflow-x: auto;
      min-height: calc(100vh - 260px);
    }

    .column {
      background: color-mix(in srgb, var(--soft) 92%, transparent);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      min-height: 540px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .05);
    }

    .column-header {
      padding: 14px;
      color: white;
      font-weight: 950;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      letter-spacing: -.2px;
    }

    .column-header span { font-size: 13px; opacity: 0.95; }
    .red { background: linear-gradient(135deg, #ef4444, #be123c); }
    .orange { background: linear-gradient(135deg, #f97316, #c2410c); }
    .yellow { background: linear-gradient(135deg, #eab308, #a16207); }
    .gray { background: linear-gradient(135deg, #94a3b8, #475569); }
    .green { background: linear-gradient(135deg, #22c55e, #15803d); }
    .purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .teal { background: linear-gradient(135deg, #14b8a6, #0f766e); }

    .task-list {
      padding: 12px;
      flex: 1;
      overflow-y: auto;
      transition: background .18s ease;
    }

    .task-list.drag-over {
      background: rgba(7, 90, 155, .08);
    }

    .task {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      border-left: 6px solid var(--blue);
      cursor: grab;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease, margin .18s ease;
      position: relative;
    }

    .task.urgent-task {
      border-left-color: #dc2626;
      background:
        linear-gradient(135deg, rgba(239, 68, 68, .12), transparent 38%),
        var(--card);
      box-shadow: 0 12px 30px rgba(220, 38, 38, .16);
    }

    .task.urgent-task h3 {
      color: #b91c1c;
    }

    .urgent-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 950;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .urgent-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid #fecaca;
      background: #fff1f2;
      color: #991b1b;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 950;
      cursor: pointer;
      user-select: none;
    }

    body.dark .urgent-toggle {
      background: rgba(127, 29, 29, .35);
      color: #fecaca;
      border-color: rgba(248, 113, 113, .35);
    }

    .urgent-toggle input {
      width: auto;
      accent-color: #dc2626;
    }

    .task:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .task.dragging { opacity: 0.45; transform: rotate(1.5deg) scale(.985); }

    .task-placeholder {
      height: 92px;
      border: 2px dashed var(--blue);
      border-radius: 16px;
      background: rgba(7, 90, 155, .10);
      margin-bottom: 12px;
      animation: placeholderPulse .8s ease-in-out infinite alternate;
    }

    @keyframes placeholderPulse {
      from { opacity: .55; transform: scale(.99); }
      to { opacity: 1; transform: scale(1); }
    }

    .task h3 { margin: 0 0 8px; font-size: 16px; color: var(--blue); line-height: 1.25; }
    .task p {
      margin: 0 0 10px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      white-space: pre-wrap;
      max-height: 92px;
      overflow: hidden;
    }

    .task-id { font-size: 11px; font-weight: 950; color: var(--muted); margin-bottom: 6px; letter-spacing: .2px; }

    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .badge {
      font-size: 11px;
      border: 1px solid var(--border);
      background: rgba(148, 163, 184, .14);
      color: var(--muted);
      padding: 4px 7px;
      border-radius: 999px;
      font-weight: 850;
    }

    .task-images, .preview { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }

    .task-images img {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform .15s ease;
    }
    .task-images img:hover { transform: scale(1.04); }

    .meta {
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      display: grid;
      gap: 4px;
    }

    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

    .small-btn {
      border: none;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
      background: #eef2ff;
      color: #1e3a8a;
      font-weight: 900;
      transition: transform .15s ease, opacity .15s ease;
    }
    .small-btn:hover { transform: translateY(-1px); opacity: .9; }
    .small-btn.delete { background: #fee2e2; color: #991b1b; }
    .small-btn.view { background: #dcfce7; color: #166534; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.68);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active { display: flex; }

    .modal-content {
      width: 100%;
      max-width: 820px;
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow-hover);
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .modal-content h2 { margin-top: 0; color: var(--blue); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 14px; }
    .form-group.full { grid-column: 1 / -1; }

    .form-group label {
      display: block;
      font-weight: 900;
      margin-bottom: 6px;
      color: var(--text);
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
      font-size: 14px;
      background: var(--input);
      color: var(--text);
    }

    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(7, 90, 155, .10);
    }

    .form-group textarea { min-height: 120px; resize: vertical; }

    .comment-compose {
      display: grid;
      grid-template-columns: 240px 1fr auto;
      gap: 8px;
      align-items: start;
      margin-top: 10px;
    }

    .comment-compose textarea { min-height: 44px; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

    .preview-item {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--soft);
    }

    .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .remove-img {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: var(--danger);
      color: white;
      cursor: pointer;
      font-weight: 950;
      line-height: 22px;
      padding: 0;
    }

    .image-viewer img { max-width: 90vw; max-height: 85vh; border-radius: 14px; box-shadow: var(--shadow); background: white; }

    .empty {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 20px 10px;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      background: rgba(255,255,255,0.25);
    }

    .comments-box, .history-box {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      background: rgba(148, 163, 184, .08);
      margin-top: 8px;
    }

    .comment, .history-item {
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text);
      display: grid;
      gap: 4px;
    }

    .comment:last-child, .history-item:last-child { border-bottom: none; }
    .comment small, .history-item small { display: block; color: var(--muted); margin-top: 2px; }
    .comment-head { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .comment-author { font-weight:950; color: var(--blue); }
    .comment-delete { border:none; background:#fee2e2; color:#991b1b; border-radius:8px; padding:5px 8px; cursor:pointer; font-weight:900; }


    .notification-wrapper {
      position: relative;
      margin-left: auto;
    }

    .bell-btn {
      position: relative;
      width: 44px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--blue);
      cursor: pointer;
      font-size: 20px;
      box-shadow: var(--shadow);
    }

    .bell-count {
      position: absolute;
      top: -7px;
      right: -7px;
      min-width: 21px;
      height: 21px;
      border-radius: 999px;
      background: #dc2626;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 950;
      padding: 0 6px;
    }

    .bell-count.show { display: flex; }

    .notification-panel {
      position: absolute;
      top: 52px;
      right: 0;
      width: min(420px, 90vw);
      max-height: 520px;
      overflow: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-hover);
      padding: 12px;
      display: none;
      z-index: 80;
    }

    .notification-panel.active { display: block; }

    .notification-panel h3 {
      margin: 4px 6px 10px;
      color: var(--blue);
    }

    .notification-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(148, 163, 184, .08);
      font-size: 13px;
    }

    .notification-item strong {
      color: var(--blue);
      display: block;
      margin-bottom: 4px;
    }

    .notification-item small {
      display: block;
      color: var(--muted);
      margin-top: 6px;
    }

    .task.moving {
      pointer-events: none;
      overflow: hidden;
    }

    .task.moving::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.76);
      backdrop-filter: blur(4px);
      z-index: 3;
    }

    body.dark .task.moving::before {
      background: rgba(15,23,42,.78);
    }

    .task.moving::after {
      content: "Moviendo...";
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
      font-weight: 950;
      font-size: 18px;
      background:
        radial-gradient(circle at calc(50% - 62px) center, transparent 0 10px, var(--blue) 11px 13px, transparent 14px);
      animation: movingPulse .8s ease-in-out infinite alternate;
    }

    @keyframes movingPulse {
      from { opacity: .68; }
      to { opacity: 1; }
    }

    .view-comment-compose {
      display: grid;
      grid-template-columns: 220px 1fr auto;
      gap: 8px;
      margin: 10px 0 14px;
      align-items: start;
    }

    .view-comment-compose input,
    .view-comment-compose textarea {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--input);
      color: var(--text);
      outline: none;
    }

    .view-comment-compose textarea { min-height: 44px; resize: vertical; }

    .pdf-note {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-left: 4px;
    }


    /* V7 Modern Premium */
    body { background: radial-gradient(circle at 6% 8%, rgba(56,189,248,.18), transparent 30%), radial-gradient(circle at 88% 12%, rgba(139,92,246,.14), transparent 32%), linear-gradient(180deg,#f8fbff 0%,var(--bg) 55%,#eef5ff 100%); }
    body.dark { background: radial-gradient(circle at 6% 8%, rgba(56,189,248,.12), transparent 30%), radial-gradient(circle at 88% 12%, rgba(139,92,246,.10), transparent 32%), linear-gradient(180deg,#0b1220 0%,#0f172a 70%); }
    header { border-bottom:1px solid rgba(255,255,255,.22); background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.18),transparent 30%),linear-gradient(135deg,#073b6d,#075a9b 55%,#0f766e); }
    header h1 { font-size:30px; font-weight:950; }
    .dashboard { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
    .stat-card { border-radius:22px; background:rgba(255,255,255,.76); transition:transform .22s ease, box-shadow .22s ease; }
    .stat-card:hover { transform:translateY(-3px); box-shadow:0 18px 40px rgba(15,23,42,.12); }
    .toolbar { margin:16px 32px 0; border:1px solid rgba(216,226,238,.72); border-radius:24px; box-shadow:0 16px 40px rgba(15,23,42,.08); background:rgba(255,255,255,.76); }
    body.dark .toolbar { background:rgba(17,24,39,.78); }
    .btn { border-radius:999px; padding:11px 17px; }
    .search,.sort-select { border-radius:999px; background:rgba(255,255,255,.72); }
    .board { padding-top:22px; }
    .column { border-radius:26px; background:rgba(255,255,255,.44); backdrop-filter:blur(18px); box-shadow:0 18px 45px rgba(15,23,42,.08); }
    body.dark .column { background:rgba(17,24,39,.56); }
    .column-header { border-radius:24px 24px 0 0; padding:16px; font-size:15px; }
    .task { border-radius:22px; padding:16px; border-left-width:0; cursor:pointer; box-shadow:0 10px 26px rgba(15,23,42,.07); animation:taskFade .28s ease both; }
    @keyframes taskFade { from{opacity:0;transform:translateY(8px) scale(.985)} to{opacity:1;transform:translateY(0) scale(1)} }
    .task::before { content:""; position:absolute; inset:0; border-radius:22px; padding:1px; background:linear-gradient(135deg,rgba(7,90,155,.22),rgba(20,184,166,.16),transparent); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
    .task:hover { transform:translateY(-5px) scale(1.012); box-shadow:0 22px 50px rgba(15,23,42,.16); }
    .task.urgent-task { border:1px solid rgba(239,68,68,.25); background:radial-gradient(circle at top right,rgba(239,68,68,.22),transparent 35%),var(--card); box-shadow:0 18px 42px rgba(220,38,38,.18); }
    .task.urgent-task::before { background:linear-gradient(135deg,rgba(239,68,68,.72),rgba(239,68,68,.16),transparent); }
    .actions { display:none!important; }
    .task-topline { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
    .task-open-hint { width:28px; height:28px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; color:var(--blue); background:rgba(7,90,155,.08); font-weight:950; transition:transform .18s ease, background .18s ease; }
    .task:hover .task-open-hint { transform:translateX(2px); background:rgba(7,90,155,.14); }
    .notification-panel { width:min(470px,92vw); border-radius:24px; background:rgba(255,255,255,.88); backdrop-filter:blur(22px); }
    body.dark .notification-panel { background:rgba(17,24,39,.92); }
    .notification-item { display:grid; grid-template-columns:42px 1fr; gap:10px; align-items:start; border-radius:18px; padding:12px; background:rgba(255,255,255,.62); transition:transform .18s ease, box-shadow .18s ease; }
    body.dark .notification-item { background:rgba(15,23,42,.58); }
    .notification-item:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(15,23,42,.10); }
    .notification-icon { width:38px; height:38px; border-radius:14px; display:inline-flex; align-items:center; justify-content:center; font-size:18px; background:#e8f2fb; color:#075a9b; }
    .notification-icon.comment { background:#ecfdf5; color:#047857; }
    .notification-icon.status_change { background:#f5f3ff; color:#6d28d9; }
    .notification-icon.new_task { background:#eff6ff; color:#1d4ed8; }
    .notification-icon.delete { background:#fef2f2; color:#b91c1c; }
    .notification-content strong { color:var(--text); font-size:13.5px; margin-bottom:4px; }
    .notification-content div { color:var(--muted); line-height:1.35; }
    #viewModal { justify-content:flex-end; align-items:stretch; padding:0; background:rgba(15,23,42,.46); backdrop-filter:blur(6px); }
    #viewModal .modal-content { max-width:620px; width:min(620px,96vw); height:100vh; max-height:100vh; border-radius:28px 0 0 28px; padding:28px; animation:drawerIn .28s cubic-bezier(.2,.8,.2,1) both; box-shadow:-24px 0 60px rgba(15,23,42,.24); }

    let tasks = [];

    async function initApp() {
      renderBoard();
      bindImageInput();
      await loadTasks();

      await loadNotifications();

      listenNotificationsRealtime();

      setStatus("Conectado a Supabase. Los cambios se sincronizan en tiempo real.");
    }

    function setStatus(text) {
      document.getElementById("connectionStatus").textContent = text;
    }

    async function loadTasks() {
      const { data, error } = await supabaseClient
        .from(TASKS_TABLE)
        .select("*")
        .order("status", { ascending: true })
        .order("position", { ascending: true, nullsFirst: false })
        .order("updated_at", { ascending: false });

      if (error) {
        console.error(error);
        setStatus("Error al cargar tareas. Revisá la anon key, RLS y columnas de la tabla tasks.");
        alert("No se pudieron cargar las tareas desde Supabase. Si agregaste este código, verificá que existan las columnas comments, history, updated_at y position.");
        return;
      }

      tasks = (data || []).map(normalizeTask);
    }

    async function seedInitialTasksIfEmpty() {
      if (tasks.length > 0) return;

      const now = new Date().toISOString();
      const rows = initialTasks.map((task, index) => ({
        code: task.code,
        title: task.title,
        description: task.description,
        status: task.status,
        urgent: Boolean(task.urgent),
        position: index + 1,
        images: [],
        comments: [],
        history: [],
        created_at: now,
        updated_at: now
      }));

      const { error } = await supabaseClient.from(TASKS_TABLE).insert(rows);

      if (error) {
        console.error(error);
        alert("No se pudieron insertar las tareas iniciales. Revisá permisos INSERT y columnas de la tabla.");
        return;
      }

      await loadTasks();
    }

    function normalizeTask(task) {
      return {
        id: task.id,
        code: task.code || "",
        title: task.title || "",
        description: task.description || "",
        status: task.status === "urgente" ? "pendiente" : (task.status || "pendiente"),
        urgent: Boolean(task.urgent || task.status === "urgente"),
        position: Number.isFinite(Number(task.position)) ? Number(task.position) : 999999,
        images: Array.isArray(task.images) ? task.images : [],
        comments: Array.isArray(task.comments) ? task.comments : [],
        history: Array.isArray(task.history) ? task.history : [],
        created_at: task.created_at || new Date().toISOString(),
        updated_at: task.updated_at || task.created_at || new Date().toISOString()
      };
    }

    function listenRealtime() {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);

      realtimeChannel = supabaseClient
        .channel("tasks-realtime")
        .on("postgres_changes", { event: "*", schema: "public", table: TASKS_TABLE }, async () => {
          if (isSaving || movingTaskIds.size > 0) return;
          await loadTasks();
          renderTasks();
        })
        .subscribe(status => {
          if (status === "SUBSCRIBED") setStatus("Realtime activo. Todos los usuarios ven el mismo tablero.");
        });
    }

    function renderBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      columns.forEach(column => {
        const div = document.createElement("section");
        div.className = "column";
        div.dataset.status = column.id;
        div.innerHTML = `
          <div class="column-header ${column.class}">
            ${column.title}
            <span id="count-${column.id}">0</span>
          </div>
          <div class="task-list" id="list-${column.id}" data-status="${column.id}"></div>
        `;
        board.appendChild(div);
      });

      document.querySelectorAll(".task-list").forEach(list => {
        list.addEventListener("dragover", handleDragOver);
        list.addEventListener("dragleave", handleDragLeave);
        list.addEventListener("drop", handleDrop);
      });
    }

    function renderDashboard() {
      const progress = tasks.length ? Math.round((countByStatus("implementado") / tasks.length) * 100) : 0;
      const stats = [
        { label: "Avance", value: progress + "%" },
        { label: "Total tareas", value: tasks.length },
        { label: "Urgentes", value: tasks.filter(task => task.urgent).length },
        { label: "En Desarrollo", value: countByStatus("desarrollo") },
        { label: "Pendientes", value: countByStatus("pendiente") },
        { label: "Test Usuario", value: countByStatus("test_usuario") },
        { label: "Para Desplegar", value: countByStatus("para_desplegar") },
        { label: "En Análisis", value: countByStatus("definicion") },
        { label: "Implementadas", value: countByStatus("implementado") }
      ];

      document.getElementById("dashboard").innerHTML = stats.map(stat => `
        <div class="stat-card">
          <strong>${stat.value}</strong>
          <span>${stat.label}</span>
        </div>
      `).join("");
    }

    function countByStatus(status) {
      return tasks.filter(task => task.status === status).length;
    }

    function renderTasks() {
      renderDashboard();
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      const sortValue = document.getElementById("sortSelect").value;

      columns.forEach(column => {
        const list = document.getElementById(`list-${column.id}`);
        list.innerHTML = "";

        const filtered = tasks
          .filter(task => task.status === column.id)
          .filter(task => {
            const text = `${task.code} ${task.title} ${task.description}`.toLowerCase();
            return text.includes(search);
          })
          .sort((a, b) => sortTasks(a, b, sortValue));

        document.getElementById(`count-${column.id}`).textContent = filtered.length;

        if (filtered.length === 0) {
          list.innerHTML = `<div class="empty">Sin tareas</div>`;
          return;
        }

        filtered.forEach(task => list.appendChild(createTaskCard(task)));
      });
    }

    function sortTasks(a, b, sortValue) {
      if (sortValue === "created_desc") return new Date(b.created_at) - new Date(a.created_at);
      if (sortValue === "updated_desc") return new Date(b.updated_at) - new Date(a.updated_at);
      if (sortValue === "title_asc") return a.title.localeCompare(b.title);
      return (a.position || 999999) - (b.position || 999999);
    }

    function createTaskCard(task) {
      const card = document.createElement("article");
      card.className = `${movingTaskIds.has(task.id) ? "task moving" : "task"} ${task.urgent ? "urgent-task" : ""}`;
      card.draggable = true;
      card.dataset.id = task.id;
      card.addEventListener("dragstart", event => dragTask(event, task.id));
      card.addEventListener("dragend", endDrag);
      card.addEventListener("click", event => {
        if (event.target.closest(".task-images")) return;
        viewTask(task.id);
      });

      const images = (task.images || []).slice(0, 4).map(img => `
        <img src="${escapeAttribute(img.url)}" onclick="event.stopPropagation(); openImageViewer('${escapeAttribute(img.url)}')" />
      `).join("");

      card.innerHTML = `
        <div class="task-topline">
          <div class="task-id">${escapeHtml(task.code || "")}</div>
          <span class="task-open-hint">›</span>
        </div>
        <h3>${escapeHtml(task.title)}</h3>
        <p>${escapeHtml(task.description)}</p>
        <div class="badges">
          ${task.urgent ? `<span class="urgent-pill">⚠ Urgente</span>` : ""}
          <span class="badge">💬 ${(task.comments || []).length}</span>
          <span class="badge">📎 ${(task.images || []).length}</span>
        </div>
        ${task.images && task.images.length ? `<div class="task-images">${images}</div>` : ""}
        <div class="meta">
          <span><b>Actualizado:</b> ${formatDate(task.updated_at)}</span>
        </div>
      `;

      return card;
    }

    function openModal() {
      document.getElementById("modalTitle").textContent = "Nueva tarea";
      document.getElementById("taskId").value = "";
      document.getElementById("taskTitle").value = "";
      document.getElementById("taskDescription").value = "";
      document.getElementById("taskStatus").value = "definicion";
      document.getElementById("taskUrgent").checked = false;
      document.getElementById("taskImages").value = "";
      document.getElementById("commentsSection").style.display = "none";
      document.getElementById("historySection").style.display = "none";
      selectedImages = [];
      renderPreview();
      document.getElementById("taskModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("taskModal").classList.remove("active");
    }

    function bindImageInput() {
      document.getElementById("taskImages").addEventListener("change", function(event) {
        const files = Array.from(event.target.files || []);
        files.forEach(file => {
          if (!file.type.startsWith("image/")) return;
          selectedImages.push({ type: "new", file, preview: URL.createObjectURL(file), name: file.name });
        });
        event.target.value = "";
        renderPreview();
      });

      document.getElementById("importFile").addEventListener("change", handleImportFile);
    }

    function renderPreview() {
      const preview = document.getElementById("imagePreview");
      preview.innerHTML = "";

      selectedImages.forEach((img, index) => {
        const item = document.createElement("div");
        item.className = "preview-item";
        item.innerHTML = `
          <img src="${escapeAttribute(img.preview || img.url)}" />
          <button class="remove-img" type="button" onclick="removeSelectedImage(${index})">×</button>
        `;
        preview.appendChild(item);
      });
    }

    function removeSelectedImage(index) {
      selectedImages.splice(index, 1);
      renderPreview();
    }

    async function uploadSelectedImages(taskId) {
      const uploaded = [];

      for (const img of selectedImages) {
        if (img.type === "saved") {
          uploaded.push({ url: img.url, path: img.path || null, name: img.name || "imagen" });
          continue;
        }

        const ext = (img.file.name.split(".").pop() || "jpg").toLowerCase();
        const safeName = img.file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const path = `${taskId}/${Date.now()}-${crypto.randomUUID()}-${safeName}`;

        const { error } = await supabaseClient.storage
          .from(STORAGE_BUCKET)
          .upload(path, img.file, { cacheControl: "3600", upsert: false, contentType: img.file.type || `image/${ext}` });

        if (error) {
          console.error(error);
          alert("No se pudo subir una imagen. Revisá políticas del bucket task-images.");
          continue;
        }

        const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
        uploaded.push({ url: data.publicUrl, path, name: img.file.name });
      }

      return uploaded;
    }

    async function saveTask() {
      const id = document.getElementById("taskId").value;
      const title = document.getElementById("taskTitle").value.trim();
      const description = document.getElementById("taskDescription").value.trim();
      const status = document.getElementById("taskStatus").value;
      const urgent = document.getElementById("taskUrgent").checked;

      if (!title || !description) {
        alert("Completá título y descripción.");
        return;
      }

      isSaving = true;
      const now = new Date().toISOString();

      if (id) {
        const oldTask = tasks.find(t => t.id === id);
        const images = await uploadSelectedImages(id);
        const history = [...(oldTask?.history || [])];

        if (oldTask && oldTask.status !== status) {
          history.push({
            from: oldTask.status,
            to: status,
            date: now,
            text: `Movimiento de ${getColumnTitle(oldTask.status)} a ${getColumnTitle(status)}`
          });
        }

        const { error } = await supabaseClient
          .from(TASKS_TABLE)
          .update({ title, description, status, urgent, images, history, updated_at: now })
          .eq("id", id);

        if (error) {
          console.error(error);
          alert("No se pudo actualizar la tarea.");
        } else if (oldTask && oldTask.status !== status) {
          await createNotification(
            "status_change",
            "Cambio de estado",
            `${oldTask.code} - ${oldTask.title} pasó de ${getColumnTitle(oldTask.status)} a ${getColumnTitle(status)}.`,
            id
          );
        }
      } else {
        const code = await generateNextCode();
        const tempId = crypto.randomUUID();
        const images = await uploadSelectedImages(tempId);
        const nextPosition = getNextPosition(status);

        const { error } = await supabaseClient.from(TASKS_TABLE).insert({
          id: tempId,
          code,
          title,
          description,
          status,
          urgent,
          position: nextPosition,
          images,
          comments: [],
          history: [{ from: null, to: status, date: now, text: `Creación en ${getColumnTitle(status)}` }],
          created_at: now,
          updated_at: now
        });

        if (error) {
          console.error(error);
          alert("No se pudo crear la tarea.");
        } else {
          await createNotification(
            "new_task",
            "Nueva tarea creada",
            `${code} - ${title} fue creada en ${getColumnTitle(status)}.`,
            tempId
          );
        }
      }

      closeModal();
      await loadTasks();
      renderTasks();
      isSaving = false;
    }

    function getNextPosition(status) {
      const sameColumn = tasks.filter(t => t.status === status);
      if (!sameColumn.length) return 1;
      return Math.max(...sameColumn.map(t => Number(t.position || 0))) + 1;
    }

    async function generateNextCode() {
      const max = tasks.reduce((acc, task) => {
        const n = parseInt(String(task.code || "").replace("ITW-", ""), 10);
        return Number.isFinite(n) ? Math.max(acc, n) : acc;
      }, 0);
      return "ITW-" + String(max + 1).padStart(3, "0");
    }

    function editTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById("modalTitle").textContent = "Editar tarea";
      document.getElementById("taskId").value = task.id;
      document.getElementById("taskTitle").value = task.title;
      document.getElementById("taskDescription").value = task.description;
      document.getElementById("taskStatus").value = task.status;
      document.getElementById("taskUrgent").checked = Boolean(task.urgent);
      document.getElementById("taskImages").value = "";
      document.getElementById("commentAuthor").value = "";
      document.getElementById("newComment").value = "";

      selectedImages = (task.images || []).map(img => ({ type: "saved", url: img.url, preview: img.url, path: img.path, name: img.name }));
      renderPreview();
      renderComments(task);
      renderHistory(task);

      document.getElementById("commentsSection").style.display = "block";
      document.getElementById("historySection").style.display = "block";
      document.getElementById("taskModal").classList.add("active");
    }

    async function deleteTask(id) {
      if (!confirm("¿Seguro que querés eliminar esta tarea?")) return;

      const task = tasks.find(t => t.id === id);
      if (task && Array.isArray(task.images)) {
        const paths = task.images.map(img => img.path).filter(Boolean);
        if (paths.length) await supabaseClient.storage.from(STORAGE_BUCKET).remove(paths);
      }

      const { error } = await supabaseClient.from(TASKS_TABLE).delete().eq("id", id);

      if (error) {
        console.error(error);
        alert("No se pudo eliminar la tarea.");
        return;
      }

      await createNotification(
        "delete",
        "Tarea eliminada",
        `${task?.code || ""} - ${task?.title || "Tarea"} fue eliminada.`,
        id
      );

      await loadTasks();
      renderTasks();
    }

    function dragTask(event, id) {
      draggedTaskId = id;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("taskId", id);
      event.currentTarget.classList.add("dragging");

      placeholder = document.createElement("div");
      placeholder.className = "task-placeholder";
    }

    function handleDragOver(event) {
      event.preventDefault();
      const list = event.currentTarget;
      list.classList.add("drag-over");
      const afterElement = getDragAfterElement(list, event.clientY);
      const empty = list.querySelector(".empty");
      if (empty) empty.remove();

      if (!placeholder) {
        placeholder = document.createElement("div");
        placeholder.className = "task-placeholder";
      }

      if (afterElement == null) {
        list.appendChild(placeholder);
      } else {
        list.insertBefore(placeholder, afterElement);
      }
    }

    function handleDragLeave(event) {
      if (!event.currentTarget.contains(event.relatedTarget)) {
        event.currentTarget.classList.remove("drag-over");
      }
    }

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll(".task:not(.dragging)")];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) return { offset, element: child };
        return closest;
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    async function handleDrop(event) {
      event.preventDefault();
      const list = event.currentTarget;
      list.classList.remove("drag-over");
      const id = event.dataTransfer.getData("taskId") || draggedTaskId;
      const task = tasks.find(t => t.id === id);
      if (!task) return endDrag();

      const newStatus = list.dataset.status;
      const orderedIds = [...list.children]
        .filter(el => el.classList.contains("task") || el.classList.contains("task-placeholder"))
        .map(el => el.classList.contains("task-placeholder") ? id : el.dataset.id)
        .filter(Boolean)
        .filter((value, index, array) => array.indexOf(value) === index);

      await applyReorder(id, newStatus, orderedIds);
      endDrag();
    }

    async function applyReorder(movedId, newStatus, orderedIdsInTarget) {
      const movedTask = tasks.find(t => t.id === movedId);
      if (!movedTask) return;

      isSaving = true;
      movingTaskIds.add(movedId);

      const now = new Date().toISOString();
      const oldStatus = movedTask.status;
      const oldTitle = movedTask.title;
      const oldCode = movedTask.code;

      // Optimista: se mueve visualmente al instante, pero la tarjeta queda con loading propio.
      tasks = tasks.map(t => {
        if (t.id === movedId) return { ...t, status: newStatus, updated_at: now };
        return t;
      });
      renderTasks();

      const updates = [];

      orderedIdsInTarget.forEach((id, index) => {
        updates.push({ id, status: newStatus, position: index + 1, updated_at: now });
      });

      if (oldStatus && oldStatus !== newStatus) {
        const oldColumnRemaining = tasks
          .filter(t => t.status === oldStatus && t.id !== movedId)
          .sort((a, b) => (a.position || 999999) - (b.position || 999999));

        oldColumnRemaining.forEach((t, index) => {
          updates.push({ id: t.id, status: oldStatus, position: index + 1, updated_at: now });
        });
      }

      try {
        await Promise.all(updates.map(item => {
          const payload = { status: item.status, position: item.position, updated_at: item.updated_at };

          if (item.id === movedId && oldStatus !== newStatus) {
            payload.history = [...(movedTask.history || []), {
              from: oldStatus,
              to: newStatus,
              date: now,
              text: `Movimiento de ${getColumnTitle(oldStatus)} a ${getColumnTitle(newStatus)}`
            }];
          }

          return supabaseClient.from(TASKS_TABLE).update(payload).eq("id", item.id);
        }));

        if (oldStatus !== newStatus) {
          await createNotification(
            "status_change",
            "Cambio de estado",
            `${oldCode} - ${oldTitle} pasó de ${getColumnTitle(oldStatus)} a ${getColumnTitle(newStatus)}.`,
            movedId
          );
        }

        await loadTasks();
      } catch (err) {
        console.error(err);
        alert("No se pudo reubicar la tarea.");
        await loadTasks();
      } finally {
        movingTaskIds.delete(movedId);
        isSaving = false;
        renderTasks();
      }
    }

    function endDrag() {
      document.querySelectorAll(".task.dragging").forEach(el => el.classList.remove("dragging"));
      document.querySelectorAll(".task-list.drag-over").forEach(el => el.classList.remove("drag-over"));
      if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
      placeholder = null;
      draggedTaskId = null;
    }

    function viewTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const images = (task.images || []).map(img => `<img src="${escapeAttribute(img.url)}" onclick="openImageViewer('${escapeAttribute(img.url)}')" />`).join("");
      const comments = (task.comments || []).map((c, i) => `
        <div class="comment">
          <div class="comment-head"><span class="comment-author">${escapeHtml(c.author || "Sin nombre")}</span></div>
          <div>${escapeHtml(c.text)}</div>
          <small>${formatDate(c.date)}</small>
        </div>
      `).join("") || "<div class='empty'>Sin comentarios</div>";
      const history = (task.history || []).map(h => `<div class="history-item">${escapeHtml(h.text)}<small>${formatDate(h.date)}</small></div>`).join("") || "<div class='empty'>Sin movimientos</div>";

      document.getElementById("viewContent").innerHTML = `
        <div class="drawer-head">
          <div>
            <div class="task-id">${escapeHtml(task.code)}</div>
            <h2 class="drawer-title">${escapeHtml(task.title)}</h2>
          </div>
          <button class="drawer-close" onclick="closeViewModal()" title="Cerrar">×</button>
        </div>

        <div class="badges">
          <span class="badge">${getColumnTitle(task.status)}</span>
          ${task.urgent ? `<span class="urgent-pill">⚠ Urgente</span>` : ""}
          <span class="badge">Creado ${formatDate(task.created_at)}</span>
          <span class="badge">Modificado ${formatDate(task.updated_at)}</span>
        </div>

        <div class="drawer-section">
          <h3>Descripción</h3>
          <p style="white-space:pre-wrap; line-height:1.58; margin:0;">${escapeHtml(task.description)}</p>
        </div>

        ${task.images?.length ? `<div class="drawer-section"><h3>Adjuntos</h3><div class="task-images">${images}</div></div>` : ""}

        <div class="drawer-section">
          <h3>Comentarios</h3>
          <div class="view-comment-compose">
            <input id="viewCommentAuthor" placeholder="Nombre obligatorio" />
            <textarea id="viewNewComment" placeholder="Agregar comentario..."></textarea>
            <button class="btn secondary" onclick="addCommentFromView('${task.id}')">Agregar comentario</button>
          </div>
          <div class="comments-box" id="viewCommentsBox">${comments}</div>
        </div>

        <div class="drawer-section">
          <h3>Historial</h3>
          <div class="history-box">${history}</div>
        </div>

        <div class="modal-actions">
          <button class="btn secondary" onclick="closeViewModal(); editTask('${task.id}')">Editar tarea</button>
          <button class="btn danger" onclick="closeViewModal(); deleteTask('${task.id}')">Eliminar</button>
        </div>
      `;
      document.getElementById("viewModal").classList.add("active");
    }

    function closeViewModal() {
      const modal = document.getElementById("viewModal");
      modal.classList.add("closing");
      setTimeout(() => {
        modal.classList.remove("active");
        modal.classList.remove("closing");
      }, 190);
    }

    async function addCommentFromModal() {
      const id = document.getElementById("taskId").value;
      const author = document.getElementById("commentAuthor").value.trim();
      const text = document.getElementById("newComment").value.trim();

      if (!id) return;
      if (!author) {
        alert("Ingresá el nombre de quien comenta.");
        document.getElementById("commentAuthor").focus();
        return;
      }
      if (!text) {
        alert("Ingresá el comentario.");
        document.getElementById("newComment").focus();
        return;
      }

      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const comments = [...(task.comments || []), { author, text, date: new Date().toISOString() }];
      const { error } = await supabaseClient
        .from(TASKS_TABLE)
        .update({ comments, updated_at: new Date().toISOString() })
        .eq("id", id);

      if (error) {
        console.error(error);
        alert("No se pudo agregar el comentario.");
        return;
      }

      await createNotification(
        "comment",
        "Nuevo comentario",
        `${author} comentó en ${task.code} - ${task.title}: ${text.slice(0, 120)}${text.length > 120 ? "..." : ""}`,
        id
      );

      document.getElementById("newComment").value = "";
      await loadTasks();
      const updated = tasks.find(t => t.id === id);
      renderComments(updated);
      renderTasks();
    }

    async function deleteComment(taskId, index) {
      if (!confirm("¿Eliminar este comentario?")) return;
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      const comments = [...(task.comments || [])];
      comments.splice(index, 1);

      const { error } = await supabaseClient
        .from(TASKS_TABLE)
        .update({ comments, updated_at: new Date().toISOString() })
        .eq("id", taskId);

      if (error) {
        console.error(error);
        alert("No se pudo eliminar el comentario.");
        return;
      }

      await loadTasks();
      const updated = tasks.find(t => t.id === taskId);
      renderComments(updated);
      renderTasks();
    }

    function renderComments(task) {
      const box = document.getElementById("commentsBox");
      const comments = task?.comments || [];
      box.innerHTML = comments.length
        ? comments.map((c, index) => `
          <div class="comment">
            <div class="comment-head">
              <span class="comment-author">${escapeHtml(c.author || "Sin nombre")}</span>
              <button class="comment-delete" type="button" onclick="deleteComment('${task.id}', ${index})">Eliminar</button>
            </div>
            <div>${escapeHtml(c.text)}</div>
            <small>${formatDate(c.date)}</small>
          </div>
        `).join("")
        : `<div class="empty">Sin comentarios</div>`;
    }

    function renderHistory(task) {
      const box = document.getElementById("historyBox");
      const history = task?.history || [];
      box.innerHTML = history.length
        ? history.map(h => `<div class="history-item">${escapeHtml(h.text)}<small>${formatDate(h.date)}</small></div>`).join("")
        : `<div class="empty">Sin movimientos</div>`;
    }

    async function addCommentFromView(taskId) {
      const authorEl = document.getElementById("viewCommentAuthor");
      const textEl = document.getElementById("viewNewComment");
      const author = authorEl.value.trim();
      const text = textEl.value.trim();

      if (!author) {
        alert("Ingresá el nombre de quien comenta.");
        authorEl.focus();
        return;
      }

      if (!text) {
        alert("Ingresá el comentario.");
        textEl.focus();
        return;
      }

      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      const now = new Date().toISOString();
      const comments = [...(task.comments || []), { author, text, date: now }];

      const { error } = await supabaseClient
        .from(TASKS_TABLE)
        .update({ comments, updated_at: now })
        .eq("id", taskId);

      if (error) {
        console.error(error);
        alert("No se pudo agregar el comentario.");
        return;
      }

      await createNotification(
        "comment",
        "Nuevo comentario",
        `${author} comentó en ${task.code} - ${task.title}: ${text.slice(0, 120)}${text.length > 120 ? "..." : ""}`,
        taskId
      );

      textEl.value = "";
      await loadTasks();
      viewTask(taskId);
      renderTasks();
    }

    async function loadNotifications() {
      const { data, error } = await supabaseClient
        .from(NOTIFICATIONS_TABLE)
        .select("*")
        .order("created_at", { ascending: false })
        .limit(40);

      if (error) {
        console.warn("No se pudieron cargar notificaciones. Creá la tabla notifications si todavía no existe.", error);
        notifications = [];
        return;
      }

      notifications = data || [];
    }

    async function createNotification(type, title, body, taskId = null) {
      const { error } = await supabaseClient
        .from(NOTIFICATIONS_TABLE)
        .insert({ type, title, body, task_id: taskId });

      if (error) console.warn("No se pudo crear la notificación.", error);
    }

    function listenNotificationsRealtime() {
      supabaseClient
        .channel("notifications-realtime")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: NOTIFICATIONS_TABLE }, async payload => {
          notifications = [payload.new, ...notifications].slice(0, 40);
          unreadNotifications += 1;
          sessionStorage.setItem("itw_unread_notifications", String(unreadNotifications));
          renderNotifications();
        })
        .subscribe();
    }

    function toggleNotifications() {
      const panel = document.getElementById("notificationPanel");
      panel.classList.toggle("active");

      if (panel.classList.contains("active")) {
        unreadNotifications = 0;
        sessionStorage.setItem("itw_unread_notifications", "0");
        renderNotifications();
      }
    }

    function renderNotifications() {
      const count = document.getElementById("notificationCount");
      const list = document.getElementById("notificationList");

      count.textContent = unreadNotifications;
      count.classList.toggle("show", unreadNotifications > 0);

      list.innerHTML = notifications.length
        ? notifications.map(n => {
          const icon = getNotificationIcon(n.type);
          return `
            <div class="notification-item">
              <span class="notification-icon ${escapeHtml(n.type || "")}">${icon}</span>
              <div class="notification-content">
                <strong>${escapeHtml(n.title || "Notificación")}</strong>
                <div>${escapeHtml(n.body || "")}</div>
                <small>${formatDate(n.created_at)}</small>
              </div>
            </div>
          `;
        }).join("")
        : `<div class="empty">Sin notificaciones</div>`;
    }

    function getNotificationIcon(type) {
      if (type === "comment") return "💬";
      if (type === "status_change") return "↗";
      if (type === "new_task") return "＋";
      if (type === "delete") return "🗑";
      return "🔔";
    }

    async function generateMeetingPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "p", unit: "mm", format: "a4" });

      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const margin = 14;

      const generatedAt = new Date().toLocaleString("es-AR", { dateStyle: "short", timeStyle: "short" });
      const total = tasks.length;

      const colors = {
        desarrollo: [249, 115, 22],
        pendiente: [234, 179, 8],
        test_usuario: [139, 92, 246],
        para_desplegar: [20, 184, 166],
        definicion: [148, 163, 184],
        implementado: [34, 197, 94]
      };

      function addHeaderFooter(pageNumberText = "") {
        doc.setFillColor(7, 90, 155);
        doc.rect(0, 0, pageWidth, 18, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.text("Backlog ITW - Resumen ejecutivo", margin, 11);

        doc.setTextColor(120, 130, 150);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.text(`Generado: ${generatedAt}`, margin, pageHeight - 8);
        if (pageNumberText) doc.text(pageNumberText, pageWidth - margin, pageHeight - 8, { align: "right" });
      }

      addHeaderFooter();

      doc.setTextColor(20, 32, 51);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(22);
      doc.text("Resumen general del backlog", margin, 34);

      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.setTextColor(90, 100, 120);
      doc.text("Documento generado automáticamente para reunión de seguimiento, priorización y control funcional.", margin, 42);

      const summaryRows = [
        ["Total de tareas", total],
        ["Tareas marcadas como urgentes", tasks.filter(task => task.urgent).length],
        ["En Desarrollo", countByStatus("desarrollo")],
        ["Pendientes", countByStatus("pendiente")],
        ["Test de Usuario", countByStatus("test_usuario")],
        ["Para Desplegar", countByStatus("para_desplegar")],
        ["Pendientes de Definición / Análisis", countByStatus("definicion")],
        ["Implementadas", countByStatus("implementado")]
      ];

      doc.autoTable({
        startY: 52,
        head: [["Indicador", "Cantidad"]],
        body: summaryRows,
        theme: "grid",
        headStyles: { fillColor: [7, 90, 155], textColor: 255, fontStyle: "bold" },
        styles: { fontSize: 10, cellPadding: 3 },
        columnStyles: { 1: { halign: "center", fontStyle: "bold" } },
        margin: { left: margin, right: margin }
      });

      let y = doc.lastAutoTable.finalY + 12;

      doc.setFont("helvetica", "bold");
      doc.setFontSize(13);
      doc.setTextColor(7, 90, 155);
      doc.text("Distribución por categoría", margin, y);

      y += 5;
      columns.forEach((col, index) => {
        const x = margin + (index % 3) * 61;
        const yy = y + Math.floor(index / 3) * 22;
        const c = colors[col.id] || [7, 90, 155];

        doc.setFillColor(c[0], c[1], c[2]);
        doc.roundedRect(x, yy, 54, 16, 3, 3, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.text(String(countByStatus(col.id)), x + 5, yy + 7);
        doc.setFontSize(7.5);
        doc.text(col.title.slice(0, 28), x + 5, yy + 12);
      });

      doc.addPage();
      addHeaderFooter();

      columns.forEach((col, colIndex) => {
        const colTasks = tasks
          .filter(t => t.status === col.id)
          .sort((a, b) => (a.position || 999999) - (b.position || 999999));

        if (colIndex > 0) {
          doc.addPage();
          addHeaderFooter();
        }

        const c = colors[col.id] || [7, 90, 155];
        doc.setFillColor(c[0], c[1], c[2]);
        doc.roundedRect(margin, 28, pageWidth - margin * 2, 12, 2, 2, "F");
        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.text(`${col.title} (${colTasks.length})`, margin + 4, 36);

        if (!colTasks.length) {
          doc.setTextColor(90, 100, 120);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(10);
          doc.text("No hay tareas registradas en esta categoría.", margin, 52);
          return;
        }

        doc.autoTable({
          startY: 48,
          head: [["ID", "Tarea", "Urg.", "Descripción", "Comentarios", "Actualizado"]],
          body: colTasks.map(t => [
            t.code || "-",
            t.title || "-",
            t.urgent ? "Sí" : "No",
            t.description || "-",
            String((t.comments || []).length),
            formatDate(t.updated_at)
          ]),
          theme: "grid",
          headStyles: { fillColor: c, textColor: 255, fontStyle: "bold" },
          styles: { fontSize: 8.5, cellPadding: 2.4, overflow: "linebreak", valign: "top" },
          columnStyles: {
            0: { cellWidth: 18, fontStyle: "bold" },
            1: { cellWidth: 38, fontStyle: "bold" },
            2: { cellWidth: 12, halign: "center" },
            3: { cellWidth: 75 },
            4: { cellWidth: 20, halign: "center" },
            5: { cellWidth: 26 }
          },
          margin: { left: margin, right: margin },
          didDrawPage: () => addHeaderFooter()
        });
      });

      const pageCount = doc.internal.getNumberOfPages();
      for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        addHeaderFooter(`Página ${i} de ${pageCount}`);
      }

      doc.save(`Resumen_Backlog_ITW_${new Date().toISOString().slice(0,10)}.pdf`);
    }

    function exportJSON() {
      const data = JSON.stringify(tasks, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "backup_backlog_itw_supabase.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON() {
      document.getElementById("importFile").click();
    }

    async function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error("El JSON debe ser un array de tareas.");

          const now = new Date().toISOString();
          const rows = imported.map((task, index) => ({
            code: task.code || `ITW-${String(index + 1).padStart(3, "0")}`,
            title: task.title || "Sin título",
            description: task.description || "Sin descripción",
            status: task.status === "urgente" ? "pendiente" : (task.status || "pendiente"),
            urgent: Boolean(task.urgent || task.status === "urgente"),
            position: Number(task.position || index + 1),
            images: Array.isArray(task.images) ? task.images : [],
            comments: Array.isArray(task.comments) ? task.comments : [],
            history: Array.isArray(task.history) ? task.history : [],
            created_at: task.created_at || now,
            updated_at: task.updated_at || now
          }));

          const { error } = await supabaseClient.from(TASKS_TABLE).insert(rows);
          if (error) throw error;

          await loadTasks();
          renderTasks();
          alert("Backup importado correctamente.");
        } catch (err) {
          console.error(err);
          alert("El archivo no tiene un formato válido o no se pudo importar.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function exportExcel() {
      const rows = tasks.map(task => ({
        ID: task.code,
        Título: task.title,
        Descripción: task.description,
        Estado: getColumnTitle(task.status),
        Urgente: task.urgent ? "Sí" : "No",
        Orden: task.position,
        Adjuntos: (task.images || []).length,
        Comentarios: (task.comments || []).length,
        Creado: formatDate(task.created_at),
        Modificado: formatDate(task.updated_at)
      }));

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Backlog ITW");
      XLSX.writeFile(wb, "backlog_itw.xlsx");
    }

    function openImageViewer(src) {
      document.getElementById("viewerImage").src = src;
      document.getElementById("imageViewer").classList.add("active");
    }

    function closeImageViewer() {
      document.getElementById("imageViewer").classList.remove("active");
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }

    function getColumnTitle(status) {
      return columns.find(c => c.id === status)?.title || status;
    }

    function formatDate(value) {
      if (!value) return "-";
      return new Date(value).toLocaleString("es-AR", { dateStyle: "short", timeStyle: "short" });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }

    function escapeAttribute(text) {
      return String(text || "").replace(/'/g, "&#39;").replace(/"/g, "&quot;");
    }
  </script>
