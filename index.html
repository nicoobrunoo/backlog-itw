<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backlog ITW - Tablero Kanban</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #162033;
      --muted: #667085;
      --border: #d8e2ee;
      --blue: #075a9b;
      --blue-2: #10395f;
      --blue-soft: #e8f2fb;
      --shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
      --shadow-hover: 0 16px 36px rgba(15, 23, 42, 0.14);
      --red: #ef4444;
      --orange: #f97316;
      --yellow: #eab308;
      --gray: #94a3b8;
      --green: #22c55e;
      --purple: #8b5cf6;
      --danger: #dc2626;
      --soft: #edf3f9;
      --input: #ffffff;
      --radius: 18px;
    }

    body.dark {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #334155;
      --blue: #38bdf8;
      --blue-2: #0f172a;
      --blue-soft: #10243a;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.36);
      --shadow-hover: 0 18px 40px rgba(0, 0, 0, 0.52);
      --soft: #1e293b;
      --input: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(11, 79, 138, .10), transparent 34%),
        var(--bg);
      color: var(--text);
    }

    header {
      background: linear-gradient(135deg, #064b83, #123b63);
      color: white;
      padding: 26px 32px;
      box-shadow: var(--shadow);
    }

    header h1 { margin: 0; font-size: 28px; letter-spacing: -.3px; }
    header p { margin: 8px 0 0; opacity: 0.92; }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(7, minmax(145px, 1fr));
      gap: 12px;
      padding: 18px 32px 0;
    }

    .stat-card {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    body.dark .stat-card { background: rgba(17,24,39,.88); }

    .stat-card strong {
      display: block;
      font-size: 27px;
      margin-bottom: 4px;
      color: var(--blue);
    }

    .stat-card span { color: var(--muted); font-size: 13px; font-weight: 800; }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 18px 32px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    button, input, textarea, select { font-family: inherit; }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 900;
      background: var(--blue);
      color: white;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      box-shadow: 0 8px 18px rgba(7, 90, 155, .18);
    }

    .btn:hover { transform: translateY(-1px); opacity: 0.94; }
    .btn.secondary { background: #e5edf7; color: #0b4f8a; box-shadow: none; }
    .btn.success { background: #dcfce7; color: #166534; box-shadow: none; }
    .btn.danger { background: #fee2e2; color: #991b1b; box-shadow: none; }

    .search, .sort-select {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      outline: none;
      background: var(--input);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
    }

    .search { flex: 1; min-width: 260px; }

    .status-line {
      padding: 0 32px 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, minmax(300px, 1fr));
      gap: 18px;
      padding: 12px 32px 24px;
      overflow-x: auto;
      min-height: calc(100vh - 260px);
    }

    .column {
      background: color-mix(in srgb, var(--soft) 92%, transparent);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      min-height: 540px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .05);
    }

    .column-header {
      padding: 14px;
      color: white;
      font-weight: 950;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      letter-spacing: -.2px;
    }

    .column-header span { font-size: 13px; opacity: 0.95; }
    .red { background: linear-gradient(135deg, #ef4444, #be123c); }
    .orange { background: linear-gradient(135deg, #f97316, #c2410c); }
    .yellow { background: linear-gradient(135deg, #eab308, #a16207); }
    .gray { background: linear-gradient(135deg, #94a3b8, #475569); }
    .green { background: linear-gradient(135deg, #22c55e, #15803d); }
    .purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

    .task-list {
      padding: 12px;
      flex: 1;
      overflow-y: auto;
      transition: background .18s ease;
    }

    .task-list.drag-over {
      background: rgba(7, 90, 155, .08);
    }

    .task {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      border-left: 6px solid var(--blue);
      cursor: grab;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease, margin .18s ease;
      position: relative;
    }

    .task:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .task.dragging { opacity: 0.45; transform: rotate(1.5deg) scale(.985); }

    .task-placeholder {
      height: 92px;
      border: 2px dashed var(--blue);
      border-radius: 16px;
      background: rgba(7, 90, 155, .10);
      margin-bottom: 12px;
      animation: placeholderPulse .8s ease-in-out infinite alternate;
    }

    @keyframes placeholderPulse {
      from { opacity: .55; transform: scale(.99); }
      to { opacity: 1; transform: scale(1); }
    }

    .task h3 { margin: 0 0 8px; font-size: 16px; color: var(--blue); line-height: 1.25; }
    .task p {
      margin: 0 0 10px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      white-space: pre-wrap;
      max-height: 92px;
      overflow: hidden;
    }

    .task-id { font-size: 11px; font-weight: 950; color: var(--muted); margin-bottom: 6px; letter-spacing: .2px; }

    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .badge {
      font-size: 11px;
      border: 1px solid var(--border);
      background: rgba(148, 163, 184, .14);
      color: var(--muted);
      padding: 4px 7px;
      border-radius: 999px;
      font-weight: 850;
    }

    .task-images, .preview { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }

    .task-images img {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform .15s ease;
    }
    .task-images img:hover { transform: scale(1.04); }

    .meta {
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      display: grid;
      gap: 4px;
    }

    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

    .small-btn {
      border: none;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
      background: #eef2ff;
      color: #1e3a8a;
      font-weight: 900;
      transition: transform .15s ease, opacity .15s ease;
    }
    .small-btn:hover { transform: translateY(-1px); opacity: .9; }
    .small-btn.delete { background: #fee2e2; color: #991b1b; }
    .small-btn.view { background: #dcfce7; color: #166534; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.68);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active { display: flex; }

    .modal-content {
      width: 100%;
      max-width: 820px;
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow-hover);
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .modal-content h2 { margin-top: 0; color: var(--blue); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { margin-bottom: 14px; }
    .form-group.full { grid-column: 1 / -1; }

    .form-group label {
      display: block;
      font-weight: 900;
      margin-bottom: 6px;
      color: var(--text);
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
      font-size: 14px;
      background: var(--input);
      color: var(--text);
    }

    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(7, 90, 155, .10);
    }

    .form-group textarea { min-height: 120px; resize: vertical; }

    .comment-compose {
      display: grid;
      grid-template-columns: 240px 1fr auto;
      gap: 8px;
      align-items: start;
      margin-top: 10px;
    }

    .comment-compose textarea { min-height: 44px; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

    .preview-item {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--soft);
    }

    .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .remove-img {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: var(--danger);
      color: white;
      cursor: pointer;
      font-weight: 950;
      line-height: 22px;
      padding: 0;
    }

    .image-viewer img { max-width: 90vw; max-height: 85vh; border-radius: 14px; box-shadow: var(--shadow); background: white; }

    .empty {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 20px 10px;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      background: rgba(255,255,255,0.25);
    }

    .comments-box, .history-box {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      background: rgba(148, 163, 184, .08);
      margin-top: 8px;
    }

    .comment, .history-item {
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text);
      display: grid;
      gap: 4px;
    }

    .comment:last-child, .history-item:last-child { border-bottom: none; }
    .comment small, .history-item small { display: block; color: var(--muted); margin-top: 2px; }
    .comment-head { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .comment-author { font-weight:950; color: var(--blue); }
    .comment-delete { border:none; background:#fee2e2; color:#991b1b; border-radius:8px; padding:5px 8px; cursor:pointer; font-weight:900; }


    .top-notifications {
      position: fixed;
      top: 22px;
      right: 28px;
      z-index: 60;
    }

    .bell-btn {
      width: 46px;
      height: 46px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(255,255,255,.16);
      color: white;
      font-size: 22px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      position: relative;
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
    }

    .bell-count {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 21px;
      height: 21px;
      border-radius: 999px;
      background: #ef4444;
      color: white;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 950;
      border: 2px solid white;
      padding: 0 5px;
    }

    .notifications-panel {
      display: none;
      position: absolute;
      top: 54px;
      right: 0;
      width: min(420px, calc(100vw - 30px));
      max-height: 520px;
      overflow-y: auto;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-hover);
      padding: 12px;
    }

    .notifications-panel.active { display: block; }

    .notifications-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      padding: 4px 4px 10px;
      margin-bottom: 8px;
    }

    .notifications-head strong { color: var(--blue); }

    .notification-item {
      border-radius: 12px;
      padding: 10px;
      border: 1px solid var(--border);
      background: rgba(148, 163, 184, .08);
      margin-bottom: 8px;
      cursor: pointer;
    }

    .notification-item.unread {
      border-left: 5px solid var(--blue);
      background: rgba(7, 90, 155, .10);
    }

    .notification-title {
      font-weight: 950;
      color: var(--blue);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .notification-body {
      font-size: 13px;
      line-height: 1.35;
    }

    .notification-date {
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 800;
    }

    .task.processing {
      pointer-events: none;
      opacity: .78;
    }

    .task-processing-overlay {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: rgba(255,255,255,.74);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 950;
      color: var(--blue);
      backdrop-filter: blur(2px);
      z-index: 4;
    }

    body.dark .task-processing-overlay {
      background: rgba(15,23,42,.76);
    }

    .mini-spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(7,90,155,.22);
      border-top-color: var(--blue);
      border-radius: 999px;
      animation: spin .75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 1200px) {
      .dashboard { grid-template-columns: repeat(3, 1fr); }
      .board { grid-template-columns: repeat(6, 300px); }
    }

    @media (max-width: 760px) {
      header, .toolbar, .board, .dashboard, .status-line { padding-left: 16px; padding-right: 16px; }
      header h1 { font-size: 22px; }
      .dashboard { grid-template-columns: repeat(2, 1fr); }
      .form-grid, .comment-compose { grid-template-columns: 1fr; }
      .board { grid-template-columns: repeat(6, 285px); }
    }
  </style>
</head>

<body>
  <header>
    <h1>Backlog ITW - Tablero Kanban</h1>
    <p>Gestión de mejoras, ajustes, bugs y nuevas funcionalidades del Iniciador de Trámites Web.</p>
  </header>

  <div class="top-notifications">
    <button class="bell-btn" onclick="toggleNotifications()" title="Notificaciones">🔔
      <span class="bell-count" id="bellCount" style="display:none;">0</span>
    </button>
    <div class="notifications-panel" id="notificationsPanel">
      <div class="notifications-head">
        <strong>Notificaciones</strong>
        <button class="small-btn" onclick="markNotificationsRead()">Marcar leídas</button>
      </div>
      <div id="notificationsList"></div>
    </div>
  </div>

  <section class="dashboard" id="dashboard"></section>

  <section class="toolbar">
    <button class="btn" onclick="openModal()">+ Nueva tarea</button>
    <button class="btn secondary" onclick="exportJSON()">Exportar JSON</button>
    <button class="btn secondary" onclick="importJSON()">Importar JSON</button>
    <button class="btn success" onclick="exportExcel()">Exportar Excel</button>
    <button class="btn secondary" onclick="toggleDarkMode()">Modo oscuro</button>
    <input type="file" id="importFile" accept=".json" hidden />
    <input class="search" id="searchInput" placeholder="Buscar por título, descripción o ID..." oninput="renderTasks()" />
    <select class="sort-select" id="sortSelect" onchange="renderTasks()">
      <option value="manual">Orden manual</option>
      <option value="updated_desc">Última modificación</option>
      <option value="created_desc">Fecha creación</option>
      <option value="title_asc">Título A-Z</option>
    </select>
  </section>

  <div class="status-line" id="connectionStatus">Conectando con Supabase...</div>
  <main class="board" id="board"></main>

  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h2 id="modalTitle">Nueva tarea</h2>
      <input type="hidden" id="taskId" />

      <div class="form-grid">
        <div class="form-group full">
          <label>Título</label>
          <input id="taskTitle" placeholder="Ej: Ajustar botón de subir archivo" />
        </div>

        <div class="form-group full">
          <label>Descripción</label>
          <textarea id="taskDescription" placeholder="Explicá claramente qué se necesita, cuál es el problema actual y qué comportamiento se espera."></textarea>
        </div>

        <div class="form-group full">
          <label>Estado</label>
          <select id="taskStatus">
            <option value="urgente">Prioridad alta / urgente</option>
            <option value="desarrollo">En desarrollo</option>
            <option value="pendiente">Pendiente</option>
            <option value="test_usuario">Test de usuario</option>
            <option value="definicion">Pendiente de definición / análisis</option>
            <option value="implementado">Implementado</option>
          </select>
        </div>

        <div class="form-group full">
          <label>Adjuntar imágenes</label>
          <input id="taskImages" type="file" accept="image/*" multiple />
          <div class="preview" id="imagePreview"></div>
        </div>

        <div class="form-group full" id="commentsSection" style="display:none;">
          <label>Comentarios</label>
          <div class="comments-box" id="commentsBox"></div>
          <div class="comment-compose">
            <input id="commentAuthor" placeholder="Nombre obligatorio" />
            <textarea id="newComment" placeholder="Comentario obligatorio..."></textarea>
            <button class="btn secondary" type="button" onclick="addCommentFromModal()">Agregar</button>
          </div>
        </div>

        <div class="form-group full" id="historySection" style="display:none;">
          <label>Historial de movimientos</label>
          <div class="history-box" id="historyBox"></div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn" onclick="saveTask()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="modal" id="viewModal">
    <div class="modal-content" id="viewContent"></div>
  </div>

  <div class="modal image-viewer" id="imageViewer" onclick="closeImageViewer()">
    <img id="viewerImage" />
  </div>

  <script>
    /*******************************************************************
     * CONFIGURACIÓN SUPABASE
     *******************************************************************/
    const SUPABASE_URL = "https://mygijycrfrbiqjachhxy.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_90DLZu5l2xkJHRjYg8ytvQ_s0tIr7Hr";
    const TASKS_TABLE = "tasks";
    const NOTIFICATIONS_TABLE = "notifications";
    const STORAGE_BUCKET = "task-images";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const columns = [
      { id: "urgente", title: "Prioridad Alta / Urgente", class: "red" },
      { id: "desarrollo", title: "En Desarrollo", class: "orange" },
      { id: "pendiente", title: "Pendientes", class: "yellow" },
      { id: "test_usuario", title: "Test de Usuario", class: "purple" },
      { id: "definicion", title: "Pendientes de Definición / Análisis", class: "gray" },
      { id: "implementado", title: "Implementado", class: "green" }
    ];

    const initialTasks = [
      { code: "ITW-001", title: "Implementación del módulo de Representados", description: "Implementar en Escobar 360 la funcionalidad de representados, actualmente disponible únicamente en SGT. El objetivo es permitir que los usuarios puedan operar en nombre de empresas o personas jurídicas asociadas a su perfil.", status: "urgente" },
      { code: "ITW-002", title: "Autenticación automática para trámites externos", description: "Implementar autenticación automática para trámites externos como Certificado Fiscal o Boleta Digital, evitando que el usuario vuelva a ingresar manualmente su CUIT.", status: "urgente" },
      { code: "ITW-003", title: "Trámite de Abasto - Autorización de Ingreso de Mercadería", description: "Implementar la generación de una constancia correspondiente a la autorización de ingreso de mercadería dentro del trámite de Abasto.", status: "desarrollo" },
      { code: "ITW-004", title: "Rediseño del reporte del trámite", description: "Rediseñar el reporte generado por ITW para mejorar la claridad, organización y presentación de los datos.", status: "pendiente" },
      { code: "ITW-005", title: "Visualización de títulos en el reporte", description: "Incorporar en el reporte final los títulos y subtítulos configurados dentro del trámite.", status: "pendiente" },
      { code: "ITW-006", title: "Leyenda compresor de archivo", description: "Modificar el mensaje visible cuando un archivo supera el límite permitido, indicando que debe comprimirse antes de adjuntarlo.", status: "pendiente" },
      { code: "ITW-007", title: "Pasaje de ITW a producción en App Ciudadana", description: "Adaptar ITW para que pueda visualizarse y funcionar correctamente dentro de App Ciudadana en ambiente productivo.", status: "pendiente" },
      { code: "ITW-008", title: "Problema en Ver Trámite", description: "Corregir el comportamiento de navegación al visualizar un trámite en App Ciudadana.", status: "pendiente" },

      { code: "ITW-013", title: "Licencias de Conducir - Turnero", description: "Analizar la incorporación de un módulo de gestión de turnos para Licencias de Conducir.", status: "definicion" },
      { code: "ITW-014", title: "Conversión automática JPG/PNG a PDF", description: "Evaluar e implementar conversión automática a PDF para archivos adjuntos en formato JPG o PNG.", status: "definicion" },
      { code: "ITW-015", title: "Implementación de scroll continuo", description: "Analizar la posibilidad de reemplazar la división de formularios en múltiples páginas por scroll continuo.", status: "definicion" },
      { code: "ITW-016", title: "Mejora en componente CHECK", description: "Mejorar la usabilidad del componente CHECK permitiendo seleccionar haciendo clic sobre el texto o área asociada.", status: "definicion" },
      { code: "ITW-017", title: "Ajustar botón Subir Archivo (Web)", description: "Revisar y ajustar el botón Subir archivo en la versión web del formulario.", status: "definicion" },
      { code: "ITW-018", title: "Nuevo componente de Título", description: "Crear un nuevo componente específico de título para dividir en secciones cada trámite.", status: "implementado" },
      { code: "ITW-019", title: "Actualización tamaño máximo archivos a 20MB", description: "Actualizar el límite máximo permitido para adjuntar archivos, pasando de 15 MB a 20 MB.", status: "implementado" },
      { code: "ITW-020", title: "Validación PDF obligatorio", description: "Incorporar validación para indicar que únicamente se permiten documentos en formato PDF cuando corresponda.", status: "implementado" },
      { code: "ITW-021", title: "Nuevo campo fecha modificación", description: "Agregar un nuevo campo de fecha de modificación en la tabla TRAMITES.TRAMITE.", status: "implementado" },
      { code: "ITW-022", title: "Corrección label componentes", description: "Eliminar leyendas incorrectas de límite de archivo en componentes que no corresponden.", status: "implementado" },
      { code: "ITW-023", title: "Componente Aviso", description: "Conservar el componente anterior de Título para reutilizarlo como componente de aviso o advertencia.", status: "implementado" }

    let tasks = [];
    let selectedImages = [];
    let realtimeChannel = null;
    let notificationsChannel = null;
    let notifications = [];
    let movingTaskIds = new Set();
    let isSaving = false;
    let draggedTaskId = null;
    let placeholder = null;

    document.addEventListener("DOMContentLoaded", initApp);

    async function initApp() {
      renderBoard();
      bindImageInput();
      await loadTasks();
      await seedInitialTasksIfEmpty();
      await loadNotifications();
      listenRealtime();
      listenNotificationsRealtime();
      renderTasks();
      renderNotifications();
      setStatus("Conectado a Supabase. Los cambios se sincronizan en tiempo real.");
    }

    function setStatus(text) {
      document.getElementById("connectionStatus").textContent = text;
    }

    async function loadTasks() {
      const { data, error } = await supabaseClient
        .from(TASKS_TABLE)
        .select("*")
        .order("status", { ascending: true })
        .order("position", { ascending: true, nullsFirst: false })
        .order("updated_at", { ascending: false });

      if (error) {
        console.error(error);
        setStatus("Error al cargar tareas. Revisá la anon key, RLS y columnas de la tabla tasks.");
        alert("No se pudieron cargar las tareas desde Supabase. Si agregaste este código, verificá que existan las columnas comments, history, updated_at y position.");
        return;
      }

      tasks = (data || []).map(normalizeTask);
    }

    async function seedInitialTasksIfEmpty() {
      if (tasks.length > 0) return;

      const now = new Date().toISOString();
      const rows = initialTasks.map((task, index) => ({
        code: task.code,
        title: task.title,
        description: task.description,
        status: task.status,
        position: index + 1,
        images: [],
        comments: [],
        history: [],
        created_at: now,
        updated_at: now
      }));

      const { error } = await supabaseClient.from(TASKS_TABLE).insert(rows);

      if (error) {
        console.error(error);
        alert("No se pudieron insertar las tareas iniciales. Revisá permisos INSERT y columnas de la tabla.");
        return;
      }

      await loadTasks();
    }

    function normalizeTask(task) {
      return {
        id: task.id,
        code: task.code || "",
        title: task.title || "",
        description: task.description || "",
        status: task.status || "pendiente",
        position: Number.isFinite(Number(task.position)) ? Number(task.position) : 999999,
        images: Array.isArray(task.images) ? task.images : [],
        comments: Array.isArray(task.comments) ? task.comments : [],
        history: Array.isArray(task.history) ? task.history : [],
        created_at: task.created_at || new Date().toISOString(),
        updated_at: task.updated_at || task.created_at || new Date().toISOString()
      };
    }

    function listenRealtime() {
      if (realtimeChannel) supabaseClient.removeChannel(realtimeChannel);

      realtimeChannel = supabaseClient
        .channel("tasks-realtime")
        .on("postgres_changes", { event: "*", schema: "public", table: TASKS_TABLE }, async () => {
          if (isSaving) return;
          await loadTasks();
          renderTasks();
        })
        .subscribe(status => {
          if (status === "SUBSCRIBED") setStatus("Realtime activo. Todos los usuarios ven el mismo tablero.");
        });
    }

    function renderBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      columns.forEach(column => {
        const div = document.createElement("section");
        div.className = "column";
        div.dataset.status = column.id;
        div.innerHTML = `
          <div class="column-header ${column.class}">
            ${column.title}
            <span id="count-${column.id}">0</span>
          </div>
          <div class="task-list" id="list-${column.id}" data-status="${column.id}"></div>
        `;
        board.appendChild(div);
      });

      document.querySelectorAll(".task-list").forEach(list => {
        list.addEventListener("dragover", handleDragOver);
        list.addEventListener("dragleave", handleDragLeave);
        list.addEventListener("drop", handleDrop);
      });
    }

    function renderDashboard() {
      const stats = [
        { label: "Total tareas", value: tasks.length },
        { label: "Urgentes", value: countByStatus("urgente") },
        { label: "En Desarrollo", value: countByStatus("desarrollo") },
        { label: "Pendientes", value: countByStatus("pendiente") },
        { label: "Test Usuario", value: countByStatus("test_usuario") },
        { label: "En Análisis", value: countByStatus("definicion") },
        { label: "Implementadas", value: countByStatus("implementado") }
      ];

      document.getElementById("dashboard").innerHTML = stats.map(stat => `
        <div class="stat-card">
          <strong>${stat.value}</strong>
          <span>${stat.label}</span>
        </div>
      `).join("");
    }

    function countByStatus(status) {
      return tasks.filter(task => task.status === status).length;
    }

    function renderTasks() {
      renderDashboard();
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      const sortValue = document.getElementById("sortSelect").value;

      columns.forEach(column => {
        const list = document.getElementById(`list-${column.id}`);
        list.innerHTML = "";

        const filtered = tasks
          .filter(task => task.status === column.id)
          .filter(task => {
            const text = `${task.code} ${task.title} ${task.description}`.toLowerCase();
            return text.includes(search);
          })
          .sort((a, b) => sortTasks(a, b, sortValue));

        document.getElementById(`count-${column.id}`).textContent = filtered.length;

        if (filtered.length === 0) {
          list.innerHTML = `<div class="empty">Sin tareas</div>`;
          return;
        }

        filtered.forEach(task => list.appendChild(createTaskCard(task)));
      });
    }

    function sortTasks(a, b, sortValue) {
      if (sortValue === "created_desc") return new Date(b.created_at) - new Date(a.created_at);
      if (sortValue === "updated_desc") return new Date(b.updated_at) - new Date(a.updated_at);
      if (sortValue === "title_asc") return a.title.localeCompare(b.title);
      return (a.position || 999999) - (b.position || 999999);
    }

    function createTaskCard(task) {
      const card = document.createElement("article");
      card.className = movingTaskIds.has(task.id) ? "task processing" : "task";
      card.draggable = true;
      card.dataset.id = task.id;
      card.addEventListener("dragstart", event => dragTask(event, task.id));
      card.addEventListener("dragend", endDrag);

      const images = (task.images || []).slice(0, 4).map(img => `
        <img src="${escapeAttribute(img.url)}" onclick="openImageViewer('${escapeAttribute(img.url)}')" />
      `).join("");

      card.innerHTML = `
        <div class="task-id">${escapeHtml(task.code || "")}</div>
        <h3>${escapeHtml(task.title)}</h3>
        <p>${escapeHtml(task.description)}</p>
        <div class="badges">
          <span class="badge">${(task.comments || []).length} comentarios</span>
          <span class="badge">${(task.images || []).length} adjuntos</span>
        </div>
        ${task.images && task.images.length ? `<div class="task-images">${images}</div>` : ""}
        <div class="meta">
          <span><b>Creado:</b> ${formatDate(task.created_at)} · <b>Modificado:</b> ${formatDate(task.updated_at)}</span>
        </div>
        <div class="actions">
          <button class="small-btn view" onclick="viewTask('${task.id}')">Ver</button>
          <button class="small-btn" onclick="editTask('${task.id}')">Editar</button>
          <button class="small-btn delete" onclick="deleteTask('${task.id}')">Eliminar</button>
        </div>
      `;

      if (movingTaskIds.has(task.id)) {
        const overlay = document.createElement("div");
        overlay.className = "task-processing-overlay";
        overlay.innerHTML = `<span class="mini-spinner"></span><span>Moviendo...</span>`;
        card.appendChild(overlay);
      }

      return card;
    }

    function openModal() {
      document.getElementById("modalTitle").textContent = "Nueva tarea";
      document.getElementById("taskId").value = "";
      document.getElementById("taskTitle").value = "";
      document.getElementById("taskDescription").value = "";
      document.getElementById("taskStatus").value = "definicion";
      document.getElementById("taskImages").value = "";
      document.getElementById("commentsSection").style.display = "none";
      document.getElementById("historySection").style.display = "none";
      selectedImages = [];
      renderPreview();
      document.getElementById("taskModal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("taskModal").classList.remove("active");
    }

    function bindImageInput() {
      document.getElementById("taskImages").addEventListener("change", function(event) {
        const files = Array.from(event.target.files || []);
        files.forEach(file => {
          if (!file.type.startsWith("image/")) return;
          selectedImages.push({ type: "new", file, preview: URL.createObjectURL(file), name: file.name });
        });
        event.target.value = "";
        renderPreview();
      });

      document.getElementById("importFile").addEventListener("change", handleImportFile);
    }

    function renderPreview() {
      const preview = document.getElementById("imagePreview");
      preview.innerHTML = "";

      selectedImages.forEach((img, index) => {
        const item = document.createElement("div");
        item.className = "preview-item";
        item.innerHTML = `
          <img src="${escapeAttribute(img.preview || img.url)}" />
          <button class="remove-img" type="button" onclick="removeSelectedImage(${index})">×</button>
        `;
        preview.appendChild(item);
      });
    }

    function removeSelectedImage(index) {
      selectedImages.splice(index, 1);
      renderPreview();
    }

    async function uploadSelectedImages(taskId) {
      const uploaded = [];

      for (const img of selectedImages) {
        if (img.type === "saved") {
          uploaded.push({ url: img.url, path: img.path || null, name: img.name || "imagen" });
          continue;
        }

        const ext = (img.file.name.split(".").pop() || "jpg").toLowerCase();
        const safeName = img.file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const path = `${taskId}/${Date.now()}-${crypto.randomUUID()}-${safeName}`;

        const { error } = await supabaseClient.storage
          .from(STORAGE_BUCKET)
          .upload(path, img.file, { cacheControl: "3600", upsert: false, contentType: img.file.type || `image/${ext}` });

        if (error) {
          console.error(error);
          alert("No se pudo subir una imagen. Revisá políticas del bucket task-images.");
          continue;
        }

        const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
        uploaded.push({ url: data.publicUrl, path, name: img.file.name });
      }

      return uploaded;
    }

    async function saveTask() {
      const id = document.getElementById("taskId").value;
      const title = document.getElementById("taskTitle").value.trim();
      const description = document.getElementById("taskDescription").value.trim();
      const status = document.getElementById("taskStatus").value;

      if (!title || !description) {
        alert("Completá título y descripción.");
        return;
      }

      isSaving = true;
      const now = new Date().toISOString();

      if (id) {
        const oldTask = tasks.find(t => t.id === id);
        const images = await uploadSelectedImages(id);
        const history = [...(oldTask?.history || [])];

        const changedStatus = oldTask && oldTask.status !== status;
        if (changedStatus) {
          history.push({
            from: oldTask.status,
            to: status,
            date: now,
            text: `Movimiento de ${getColumnTitle(oldTask.status)} a ${getColumnTitle(status)}`
          });
        }

        const { error } = await supabaseClient
          .from(TASKS_TABLE)
          .update({ title, description, status, images, history, updated_at: now })
          .eq("id", id);

        if (error) {
          console.error(error);
          alert("No se pudo actualizar la tarea.");
        } else if (changedStatus) {
          await createNotification("move", `Cambio de estado: ${oldTask.code || ""}`, `${oldTask.title} pasó de ${getColumnTitle(oldTask.status)} a ${getColumnTitle(status)}.`, id);
        }
      } else {
        const code = await generateNextCode();
        const tempId = crypto.randomUUID();
        const images = await uploadSelectedImages(tempId);
        const nextPosition = getNextPosition(status);

        const { error } = await supabaseClient.from(TASKS_TABLE).insert({
          id: tempId,
          code,
          title,
          description,
          status,
          position: nextPosition,
          images,
          comments: [],
          history: [{ from: null, to: status, date: now, text: `Creación en ${getColumnTitle(status)}` }],
          created_at: now,
          updated_at: now
        });

        if (error) {
          console.error(error);
          alert("No se pudo crear la tarea.");
        } else {
          await createNotification("create", `Nueva tarea: ${code}`, `${title} fue creada en ${getColumnTitle(status)}.`, tempId);
        }
      }

      closeModal();
      if (movedTask && oldStatus !== newStatus) {
        await createNotification("move", `Cambio de estado: ${movedTask.code || ""}`, `${movedTask.title} pasó de ${getColumnTitle(oldStatus)} a ${getColumnTitle(newStatus)}.`, movedId);
      }

      await loadTasks();
      movingTaskIds.delete(movedId);
      renderTasks();
      isSaving = false;
    }

    function getNextPosition(status) {
      const sameColumn = tasks.filter(t => t.status === status);
      if (!sameColumn.length) return 1;
      return Math.max(...sameColumn.map(t => Number(t.position || 0))) + 1;
    }

    async function generateNextCode() {
      const max = tasks.reduce((acc, task) => {
        const n = parseInt(String(task.code || "").replace("ITW-", ""), 10);
        return Number.isFinite(n) ? Math.max(acc, n) : acc;
      }, 0);
      return "ITW-" + String(max + 1).padStart(3, "0");
    }

    function editTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById("modalTitle").textContent = "Editar tarea";
      document.getElementById("taskId").value = task.id;
      document.getElementById("taskTitle").value = task.title;
      document.getElementById("taskDescription").value = task.description;
      document.getElementById("taskStatus").value = task.status;
      document.getElementById("taskImages").value = "";
      document.getElementById("commentAuthor").value = "";
      document.getElementById("newComment").value = "";

      selectedImages = (task.images || []).map(img => ({ type: "saved", url: img.url, preview: img.url, path: img.path, name: img.name }));
      renderPreview();
      renderComments(task);
      renderHistory(task);

      document.getElementById("commentsSection").style.display = "block";
      document.getElementById("historySection").style.display = "block";
      document.getElementById("taskModal").classList.add("active");
    }

    async function deleteTask(id) {
      if (!confirm("¿Seguro que querés eliminar esta tarea?")) return;

      const task = tasks.find(t => t.id === id);
      if (task && Array.isArray(task.images)) {
        const paths = task.images.map(img => img.path).filter(Boolean);
        if (paths.length) await supabaseClient.storage.from(STORAGE_BUCKET).remove(paths);
      }

      const { error } = await supabaseClient.from(TASKS_TABLE).delete().eq("id", id);

      if (error) {
        console.error(error);
        alert("No se pudo eliminar la tarea.");
        return;
      }

      await loadTasks();
      renderTasks();
    }

    function dragTask(event, id) {
      draggedTaskId = id;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("taskId", id);
      event.currentTarget.classList.add("dragging");

      placeholder = document.createElement("div");
      placeholder.className = "task-placeholder";
    }

    function handleDragOver(event) {
      event.preventDefault();
      const list = event.currentTarget;
      list.classList.add("drag-over");
      const afterElement = getDragAfterElement(list, event.clientY);
      const empty = list.querySelector(".empty");
      if (empty) empty.remove();

      if (!placeholder) {
        placeholder = document.createElement("div");
        placeholder.className = "task-placeholder";
      }

      if (afterElement == null) {
        list.appendChild(placeholder);
      } else {
        list.insertBefore(placeholder, afterElement);
      }
    }

    function handleDragLeave(event) {
      if (!event.currentTarget.contains(event.relatedTarget)) {
        event.currentTarget.classList.remove("drag-over");
      }
    }

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll(".task:not(.dragging)")];

      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) return { offset, element: child };
        return closest;
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    async function handleDrop(event) {
      event.preventDefault();
      const list = event.currentTarget;
      list.classList.remove("drag-over");
      const id = event.dataTransfer.getData("taskId") || draggedTaskId;
      const task = tasks.find(t => t.id === id);
      if (!task) return endDrag();

      const newStatus = list.dataset.status;
      const orderedIds = [...list.children]
        .filter(el => el.classList.contains("task") || el.classList.contains("task-placeholder"))
        .map(el => el.classList.contains("task-placeholder") ? id : el.dataset.id)
        .filter(Boolean)
        .filter((value, index, array) => array.indexOf(value) === index);

      await applyReorder(id, newStatus, orderedIds);
      endDrag();
    }

    async function applyReorder(movedId, newStatus, orderedIdsInTarget) {
      isSaving = true;
      movingTaskIds.add(movedId);
      const now = new Date().toISOString();
      const movedTask = tasks.find(t => t.id === movedId);
      const oldStatus = movedTask?.status;

      if (movedTask) {
        movedTask.status = newStatus;
        movedTask.position = orderedIdsInTarget.indexOf(movedId) + 1;
        movedTask.updated_at = now;
        renderTasks();
      }

      const updates = [];

      orderedIdsInTarget.forEach((id, index) => {
        updates.push({ id, status: newStatus, position: index + 1, updated_at: now });
      });

      if (oldStatus && oldStatus !== newStatus) {
        const oldColumnRemaining = tasks
          .filter(t => t.status === oldStatus && t.id !== movedId)
          .sort((a, b) => (a.position || 999999) - (b.position || 999999));

        oldColumnRemaining.forEach((t, index) => {
          updates.push({ id: t.id, status: oldStatus, position: index + 1, updated_at: now });
        });
      }

      for (const item of updates) {
        const payload = { status: item.status, position: item.position, updated_at: item.updated_at };

        if (item.id === movedId && oldStatus !== newStatus) {
          payload.history = [...(movedTask.history || []), {
            from: oldStatus,
            to: newStatus,
            date: now,
            text: `Movimiento de ${getColumnTitle(oldStatus)} a ${getColumnTitle(newStatus)}`
          }];
        }

        const { error } = await supabaseClient.from(TASKS_TABLE).update(payload).eq("id", item.id);
        if (error) {
          console.error(error);
          alert("No se pudo reubicar la tarea. Revisá que exista la columna position.");
          break;
        }
      }

      await loadTasks();
      renderTasks();
      isSaving = false;
    }

    function endDrag() {
      document.querySelectorAll(".task.dragging").forEach(el => el.classList.remove("dragging"));
      document.querySelectorAll(".task-list.drag-over").forEach(el => el.classList.remove("drag-over"));
      if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
      placeholder = null;
      draggedTaskId = null;
    }

    function viewTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const images = (task.images || []).map(img => `<img src="${escapeAttribute(img.url)}" onclick="openImageViewer('${escapeAttribute(img.url)}')" />`).join("");
      const comments = (task.comments || []).map((c, i) => `
        <div class="comment">
          <div class="comment-head"><span class="comment-author">${escapeHtml(c.author || "Sin nombre")}</span></div>
          <div>${escapeHtml(c.text)}</div>
          <small>${formatDate(c.date)}</small>
        </div>
      `).join("") || "<div class='empty'>Sin comentarios</div>";
      const history = (task.history || []).map(h => `<div class="history-item">${escapeHtml(h.text)}<small>${formatDate(h.date)}</small></div>`).join("") || "<div class='empty'>Sin movimientos</div>";

      document.getElementById("viewContent").innerHTML = `
        <h2>${escapeHtml(task.code)} - ${escapeHtml(task.title)}</h2>
        <p style="white-space:pre-wrap; line-height:1.55;">${escapeHtml(task.description)}</p>
        <div class="badges">
          <span class="badge">${getColumnTitle(task.status)}</span>
          <span class="badge">Creado ${formatDate(task.created_at)}</span>
          <span class="badge">Modificado ${formatDate(task.updated_at)}</span>
        </div>
        ${task.images?.length ? `<h3>Adjuntos</h3><div class="task-images">${images}</div>` : ""}
        <h3>Comentarios</h3><div class="comments-box">${comments}</div>
        <div class="comment-compose">
          <input id="viewCommentAuthor" placeholder="Nombre obligatorio" />
          <textarea id="viewNewComment" placeholder="Escribí un comentario..."></textarea>
          <button class="btn secondary" type="button" onclick="addCommentFromView('${task.id}')">Agregar</button>
        </div>
        <h3>Historial</h3><div class="history-box">${history}</div>
        <div class="modal-actions">
          <button class="btn secondary" onclick="closeViewModal()">Cerrar</button>
          <button class="btn" onclick="closeViewModal(); editTask('${task.id}')">Editar</button>
        </div>
      `;
      document.getElementById("viewModal").classList.add("active");
    }

    function closeViewModal() {
      document.getElementById("viewModal").classList.remove("active");
    }

    async function addCommentFromModal() {
      const id = document.getElementById("taskId").value;
      const author = document.getElementById("commentAuthor").value.trim();
      const text = document.getElementById("newComment").value.trim();

      if (!id) return;
      if (!author) {
        alert("Ingresá el nombre de quien comenta.");
        document.getElementById("commentAuthor").focus();
        return;
      }
      if (!text) {
        alert("Ingresá el comentario.");
        document.getElementById("newComment").focus();
        return;
      }

      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const comments = [...(task.comments || []), { author, text, date: new Date().toISOString() }];
      const { error } = await supabaseClient
        .from(TASKS_TABLE)
        .update({ comments, updated_at: new Date().toISOString() })
        .eq("id", id);

      if (error) {
        console.error(error);
        alert("No se pudo agregar el comentario.");
        return;
      }

      await createNotification("comment", `Nuevo comentario: ${task.code || ""}`, `${author} comentó en "${task.title}".`, id);

      document.getElementById("newComment").value = "";
      await loadTasks();
      const updated = tasks.find(t => t.id === id);
      renderComments(updated);
      renderTasks();
    }

    async function deleteComment(taskId, index) {
      if (!confirm("¿Eliminar este comentario?")) return;
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;

      const comments = [...(task.comments || [])];
      comments.splice(index, 1);

      const { error } = await supabaseClient
        .from(TASKS_TABLE)
        .update({ comments, updated_at: new Date().toISOString() })
        .eq("id", taskId);

      if (error) {
        console.error(error);
        alert("No se pudo eliminar el comentario.");
        return;
      }

      await loadTasks();
      const updated = tasks.find(t => t.id === taskId);
      renderComments(updated);
      renderTasks();
    }

    function renderComments(task) {
      const box = document.getElementById("commentsBox");
      const comments = task?.comments || [];
      box.innerHTML = comments.length
        ? comments.map((c, index) => `
          <div class="comment">
            <div class="comment-head">
              <span class="comment-author">${escapeHtml(c.author || "Sin nombre")}</span>
              <button class="comment-delete" type="button" onclick="deleteComment('${task.id}', ${index})">Eliminar</button>
            </div>
            <div>${escapeHtml(c.text)}</div>
            <small>${formatDate(c.date)}</small>
          </div>
        `).join("")
        : `<div class="empty">Sin comentarios</div>`;
    }

    function renderHistory(task) {
      const box = document.getElementById("historyBox");
      const history = task?.history || [];
      box.innerHTML = history.length
        ? history.map(h => `<div class="history-item">${escapeHtml(h.text)}<small>${formatDate(h.date)}</small></div>`).join("")
        : `<div class="empty">Sin movimientos</div>`;
    }


    async function addCommentFromView(id) {
      const authorEl = document.getElementById("viewCommentAuthor");
      const textEl = document.getElementById("viewNewComment");
      const author = authorEl?.value.trim();
      const text = textEl?.value.trim();

      if (!author) {
        alert("Ingresá el nombre de quien comenta.");
        authorEl?.focus();
        return;
      }
      if (!text) {
        alert("Ingresá el comentario.");
        textEl?.focus();
        return;
      }

      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const comments = [...(task.comments || []), { author, text, date: new Date().toISOString() }];

      const { error } = await supabaseClient
        .from(TASKS_TABLE)
        .update({ comments, updated_at: new Date().toISOString() })
        .eq("id", id);

      if (error) {
        console.error(error);
        alert("No se pudo agregar el comentario.");
        return;
      }

      await createNotification("comment", `Nuevo comentario: ${task.code || ""}`, `${author} comentó en "${task.title}".`, id);
      await loadTasks();
      renderTasks();
      viewTask(id);
    }

    async function loadNotifications() {
      const { data, error } = await supabaseClient
        .from(NOTIFICATIONS_TABLE)
        .select("*")
        .order("created_at", { ascending: false })
        .limit(60);

      if (error) {
        console.warn("No se pudieron cargar notificaciones. Verificá que exista la tabla notifications.", error);
        notifications = [];
        return;
      }

      notifications = data || [];
    }

    function listenNotificationsRealtime() {
      if (notificationsChannel) supabaseClient.removeChannel(notificationsChannel);

      notificationsChannel = supabaseClient
        .channel("notifications-realtime")
        .on("postgres_changes", { event: "*", schema: "public", table: NOTIFICATIONS_TABLE }, async () => {
          await loadNotifications();
          renderNotifications();
        })
        .subscribe();
    }

    async function createNotification(type, title, body, taskId) {
      const payload = {
        type,
        title,
        body,
        task_id: taskId || null,
        created_at: new Date().toISOString()
      };

      const { error } = await supabaseClient.from(NOTIFICATIONS_TABLE).insert(payload);

      if (error) {
        console.warn("No se pudo crear la notificación. Revisá tabla/políticas de notifications.", error);
      }
    }

    function getReadNotificationIds() {
      try {
        return JSON.parse(localStorage.getItem("itw_read_notifications") || "[]");
      } catch {
        return [];
      }
    }

    function setReadNotificationIds(ids) {
      localStorage.setItem("itw_read_notifications", JSON.stringify([...new Set(ids)]));
    }

    function renderNotifications() {
      const list = document.getElementById("notificationsList");
      const count = document.getElementById("bellCount");
      if (!list || !count) return;

      const readIds = getReadNotificationIds();
      const unread = notifications.filter(n => !readIds.includes(n.id));

      count.textContent = unread.length;
      count.style.display = unread.length ? "flex" : "none";

      if (!notifications.length) {
        list.innerHTML = `<div class="empty">Sin notificaciones</div>`;
        return;
      }

      list.innerHTML = notifications.map(n => {
        const unreadClass = readIds.includes(n.id) ? "" : "unread";
        return `
          <div class="notification-item ${unreadClass}" onclick="openNotification('${n.id}', '${n.task_id || ""}')">
            <div class="notification-title">${escapeHtml(n.title || "Notificación")}</div>
            <div class="notification-body">${escapeHtml(n.body || "")}</div>
            <div class="notification-date">${formatDate(n.created_at)}</div>
          </div>
        `;
      }).join("");
    }

    function toggleNotifications() {
      const panel = document.getElementById("notificationsPanel");
      panel.classList.toggle("active");
    }

    function markNotificationsRead() {
      setReadNotificationIds(notifications.map(n => n.id));
      renderNotifications();
    }

    function openNotification(notificationId, taskId) {
      const readIds = getReadNotificationIds();
      setReadNotificationIds([...readIds, notificationId]);
      renderNotifications();
      if (taskId) viewTask(taskId);
    }


    function exportJSON() {
      const data = JSON.stringify(tasks, null, 2);
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "backup_backlog_itw_supabase.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJSON() {
      document.getElementById("importFile").click();
    }

    async function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) throw new Error("El JSON debe ser un array de tareas.");

          const now = new Date().toISOString();
          const rows = imported.map((task, index) => ({
            code: task.code || `ITW-${String(index + 1).padStart(3, "0")}`,
            title: task.title || "Sin título",
            description: task.description || "Sin descripción",
            status: task.status || "pendiente",
            position: Number(task.position || index + 1),
            images: Array.isArray(task.images) ? task.images : [],
            comments: Array.isArray(task.comments) ? task.comments : [],
            history: Array.isArray(task.history) ? task.history : [],
            created_at: task.created_at || now,
            updated_at: task.updated_at || now
          }));

          const { error } = await supabaseClient.from(TASKS_TABLE).insert(rows);
          if (error) throw error;

          await loadTasks();
          renderTasks();
          alert("Backup importado correctamente.");
        } catch (err) {
          console.error(err);
          alert("El archivo no tiene un formato válido o no se pudo importar.");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function exportExcel() {
      const rows = tasks.map(task => ({
        ID: task.code,
        Título: task.title,
        Descripción: task.description,
        Estado: getColumnTitle(task.status),
        Orden: task.position,
        Adjuntos: (task.images || []).length,
        Comentarios: (task.comments || []).length,
        Creado: formatDate(task.created_at),
        Modificado: formatDate(task.updated_at)
      }));

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Backlog ITW");
      XLSX.writeFile(wb, "backlog_itw.xlsx");
    }

    function openImageViewer(src) {
      document.getElementById("viewerImage").src = src;
      document.getElementById("imageViewer").classList.add("active");
    }

    function closeImageViewer() {
      document.getElementById("imageViewer").classList.remove("active");
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }

    function getColumnTitle(status) {
      return columns.find(c => c.id === status)?.title || status;
    }

    function formatDate(value) {
      if (!value) return "-";
      return new Date(value).toLocaleString("es-AR", { dateStyle: "short", timeStyle: "short" });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }

    function escapeAttribute(text) {
      return String(text || "").replace(/'/g, "&#39;").replace(/"/g, "&quot;");
    }
  </script>
</body>
